name: workshop
# 3D scenes of an order (factory/orders/<order>/scenes.json: each scene described in the order, built from the kit tools).
# stage preview: scene check + no repeats + data (order store) + CPU key-frame previews with automatic checks (no GPU).
# stage render : Kaggle GPU render of the scenes whose current preview passed and was approved, cached by content in
#                factory_ws_cache.
on:
  workflow_dispatch:
    inputs:
      order: { description: 'order folder in factory/orders', required: true }
      stage: { description: 'preview | render', required: true, default: 'preview' }
  workflow_call:
    inputs:
      order: { type: string, required: true }
      stage: { type: string, required: false, default: 'preview' }

permissions:
  contents: write

jobs:
  workshop:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      GH_TOKEN: ${{ github.token }}
      ORDER: ${{ inputs.order }}
      STAGE: ${{ inputs.stage }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Hermetic check - pictures only from the order store
        run: python3 factory/rules/hermetic.py
      - name: Python packages
        run: |
          pip install -q numpy pillow scipy requests
          if [ "$STAGE" = render ]; then pip install -q "kaggle>=1.7.4"; else pip install -q shapely pyshp mapbox-earcut; fi
          if [ "$STAGE" = preview ] && grep -q '"cutout"' "factory/orders/$ORDER/scenes.json"; then pip install -q "rembg[cpu]"; fi
      - name: Order store - the order's pictures with their licences
        if: inputs.stage != 'render'
        run: |
          set -e
          S=factory/orders/$ORDER/store.json
          if [ ! -f "$S" ]; then echo "no order store (scenes without pictures)"; exit 0; fi
          R=$(python3 -c "import json; print(json.load(open('$S'))['release'])")
          mkdir -p factory/orders/$ORDER/store_files
          gh release download "$R" -R ${{ github.repository }} -D factory/orders/$ORDER/store_files --clobber
          echo "order store $R: $(ls factory/orders/$ORDER/store_files | wc -l) files"
      - name: Blender version
        id: bl
        if: inputs.stage != 'render'
        run: echo "file=$(curl -s https://download.blender.org/release/Blender4.5/ | grep -oE 'blender-4\.5\.[0-9]+-linux-x64\.tar\.xz' | sort -V | uniq | tail -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: inputs.stage != 'render'
        with: { path: /opt/blender, key: "${{ steps.bl.outputs.file }}" }
      - name: Blender
        if: inputs.stage != 'render'
        run: |
          if [ ! -x /opt/blender/blender ]; then
            sudo mkdir -p /opt/blender && sudo chown "$USER" /opt/blender
            curl -sfL --retry 3 -o /tmp/b.tar.xz "https://download.blender.org/release/Blender4.5/${{ steps.bl.outputs.file }}"
            tar -xf /tmp/b.tar.xz -C /opt/blender --strip-components=1 && rm /tmp/b.tar.xz
          fi
          if ! /opt/blender/blender -b --version > /dev/null 2>&1; then
            sudo timeout 900 apt-get install -y -qq --no-install-recommends libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 libice6 || true
          fi
          /opt/blender/blender -b --version | head -1
      - name: Workshop
        run: python3 factory/workshop/run.py factory/orders/$ORDER --stage $STAGE --blender /opt/blender/blender --release factory_ws_cache --sha ${{ github.sha }} --repo ${{ github.repository }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workshop-${{ inputs.stage }}
          path: |
            factory/orders/${{ inputs.order }}/out/workshop*.json
            factory/orders/${{ inputs.order }}/out/ws_review/
          if-no-files-found: ignore
