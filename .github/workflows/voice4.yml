name: voice4
# v4 narration: the 8 TTS takes matched to one consistent read (loudness, pitch, pace, timbre), natural joins,
# word-accurate timeline + subtitles -> release voice4
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  align:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list || true
          sudo apt-get update -q || true
          sudo apt-get install -y -q ffmpeg rubberband-cli
          rubberband --version || true
          pip install -q torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -q soundfile num2words "numpy<2.3" scipy pyloudnorm pyworld
      - run: python -u production/pipeline/align4.py
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete voice4 -y --cleanup-tag 2>/dev/null || true
          gh release create voice4 out/align/voice.wav out/align/timeline.json out/align/subtitles.srt out/align/align_report.txt out/align/dsp_report.txt \
            --title "v4 narration (matched takes, natural joins)" --notes "voice4: loudness/pitch/pace/timbre matched takes, 0.85 s joins, MMS_FA word timings"
