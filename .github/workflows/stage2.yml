name: stage2-render
# Final film: Remotion composition (Three.js globe, ECharts chart, projected maps, flag-icons) + Manim + Blender clips.
# Video: parallel chunks, each rendered by 3 independent browsers (concurrency 1) and self-checked against
# fresh-page reference stills (automatic per-frame fallback on any mismatch).
# Audio: exact AudioMix event list -> offline mix -> VO compression, music/SFX balance, -14 LUFS / -1.5 dBTP master.
# Everything is published to release "final" together with QA contact sheets and a QA report.
on:
  workflow_dispatch:
    inputs:
      parts: { description: 'parallel chunks', default: '20' }
      tag: { description: 'release tag', default: 'final' }
permissions:
  contents: write
env:
  REL: https://github.com/${{ github.repository }}/releases/download/stage1
  PARTS: ${{ inputs.parts || '20' }}
  TAG: ${{ inputs.tag || 'final' }}
jobs:
  prep:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg unzip > /dev/null
      - name: Assets from stage 1
        working-directory: production/remotion
        run: |
          set -e
          mkdir -p public/manim public/music public/sfx public/flags
          for f in basemap.jpg basemap_half.jpg globe.jpg voice.wav caucasus.mp4 matryoshka.webm sfx.zip; do curl -sfL --retry 3 -o public/$f "$REL/$f"; done
          for f in caucasus_labels.json matryoshka_timing.json; do curl -sfL --retry 3 -o src/data/$f "$REL/$f"; done
          for c in c1_hook c2_origins c3_annex c4_collapse c5_resolution; do curl -sfL --retry 3 -o public/music/music_$c.mp3 "$REL/music_$c.mp3"; done
          (cd public/sfx && unzip -q -o ../sfx.zip && rm ../sfx.zip)
          for s in ThreeRules TatarstanEstonia Timeline SecessionLaw UtiPossidetis Hierarchy; do
            curl -sfL --retry 3 -o /tmp/$s.mov "$REL/$s.mov"
            ffmpeg -v error -y -i /tmp/$s.mov -c:v libvpx-vp9 -pix_fmt yuva420p -b:v 0 -crf 22 -row-mt 1 -deadline good -cpu-used 4 public/manim/$s.webm
          done
          ffmpeg -v error -y -i public/globe.jpg -vf scale=4096:2048 public/globe_4k.jpg && rm public/globe.jpg
          curl -sfL --retry 3 -A "videomaps/1.0" -o public/flags/su.svg "https://upload.wikimedia.org/wikipedia/commons/a/a9/Flag_of_the_Soviet_Union.svg"
          pip install -q geopandas shapely pillow && python ../pipeline/globe_overlay.py public/ussr_overlay.png
          npm i --no-audit --no-fund --loglevel=error flag-icons@7.6.0 && cp -r node_modules/flag-icons/flags/4x3 public/flags/ && rm -rf node_modules
          du -sh public; ls -la public public/manim
      - id: m
        run: echo "matrix=$(python3 -c "print(list(range(int('${{ env.PARTS }}'))))")" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: film-assets
          path: |
            production/remotion/public
            production/remotion/src/data
          retention-days: 5

  render:
    needs: prep
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJson(needs.prep.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: film-assets, path: production/remotion }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null && pip install -q numpy pillow
      - name: Render chunk (3 browsers x concurrency 1) + self-check
        working-directory: production/remotion
        run: |
          npm i --no-audit --no-fund --loglevel=error
          npx remotion bundle src/index.ts --out-dir=build --log=error > /dev/null 2>&1 && npx remotion still build Main /tmp/probe.jpg --frame=0 --scale=0.1 --gl=swangle --log=error > /dev/null 2>&1 \
            && export SERVE=build || export SERVE=src/index.ts
          echo "serve: $SERVE"
          TOTAL=$(node -e "const t=require('./src/data/timeline.json'); console.log(Math.ceil(t.total*30))")
          N=${{ env.PARTS }}; P=${{ matrix.part }}; SZ=$(( (TOTAL + N - 1) / N )); A=$(( P * SZ )); B=$(( A + SZ - 1 )); [ $B -ge $TOTAL ] && B=$(( TOTAL - 1 ))
          PART=$(printf %02d $P) WORKERS=3 bash scripts/render_chunk.sh $A $B out/part_$(printf %02d $P).mp4
          ls -la out out/qa
      - uses: actions/upload-artifact@v4
        with:
          name: 'part-${{ matrix.part }}'
          path: |
            production/remotion/out/part_*.mp4
            production/remotion/out/qa/
          retention-days: 5

  audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg unzip > /dev/null && pip install -q numpy
      - name: Mix + master (voice-led, -14 LUFS)
        working-directory: production/remotion
        run: |
          set -e
          PUB=/tmp/rpub; mkdir -p $PUB/music $PUB/sfx out/audio
          curl -sfL --retry 3 -o $PUB/voice.wav "$REL/voice.wav"
          for c in c1_hook c2_origins c3_annex c4_collapse c5_resolution; do curl -sfL --retry 3 -o $PUB/music/music_$c.mp3 "$REL/music_$c.mp3"; done
          curl -sfL --retry 3 -o /tmp/sfx.zip "$REL/sfx.zip" && (cd $PUB/sfx && unzip -q -o /tmp/sfx.zip)
          npm i --no-audit --no-fund --loglevel=error
          node scripts/build_audio.mjs && EVENTS_OUT=out/audio_events.json node out/audio_events.cjs
          python ../pipeline/mix.py out/audio_events.json $PUB out/audio
          python ../pipeline/master.py out/audio | tee out/audio/audio_report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: audio-master
          path: |
            production/remotion/out/audio/mix_final.wav
            production/remotion/out/audio/audio_report.txt
          retention-days: 5

  final:
    needs: [render, audio]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: 'part-*', path: parts, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { name: audio-master, path: audio }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null && pip install -q pillow
      - name: Assemble (frame-exact), QA, publish
        env: { GH_TOKEN: '${{ github.token }}' }
        run: bash production/pipeline/assemble.sh parts audio/mix_final.wav 16807 "${{ env.TAG }}"
