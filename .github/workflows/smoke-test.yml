name: smoke-test
on:
  workflow_dispatch:
concurrency:
  group: smoke-test
  cancel-in-progress: true
defaults:
  run:
    shell: bash

jobs:
  remotion:
    name: Remotion + Three.js + ECharts
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: smoke/remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: |
          V=$(npm view remotion@^4 version --json | node -e "let d=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log(Array.isArray(d)?d[d.length-1]:d)")
          echo "Remotion version: $V"
          npm i --no-audit --no-fund --loglevel=error remotion@$V @remotion/cli@$V @remotion/three@$V @remotion/paths@$V \
            react@18.3.1 react-dom@18.3.1 three@0.169.0 @react-three/fiber@8.17.10 echarts@5.5.1 \
            d3-geo@3.1.1 topojson-client@3.1.0 world-atlas@2.0.2 flag-icons@7.2.3
          mkdir -p public/flags && cp node_modules/flag-icons/flags/4x3/ru.svg public/flags/
      - name: Render
        run: |
          mkdir -p out
          npx remotion render src/index.ts Smoke out/remotion.mp4 --gl=swangle --concurrency=4 --timeout=120000 2>&1 | (grep -v -E "^\s*Rendered|Encoded" || true) | tail -40
          ls -la out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remotion
          path: smoke/remotion/out/
          retention-days: 3

  manim:
    name: Manim
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libcairo2-dev libpango1.0-dev pkg-config ffmpeg fonts-dejavu-core > /dev/null
      - run: pip install -q manim && manim --version
      - name: Render (transparent)
        working-directory: smoke/manim
        run: |
          manim -qh -t --fps 30 --media_dir media smoke_scene.py Smoke 2>&1 | tail -5
          MOV=$(find media -name "Smoke.mov" | head -1); echo "alpha file: $MOV"
          mkdir -p out && cp "$MOV" out/manim_alpha.mov
          ffmpeg -v error -y -f lavfi -i color=c=0x15202b:s=1920x1080:r=30 -i out/manim_alpha.mov \
            -filter_complex "[0][1]overlay=shortest=1,format=yuv420p" -c:v libx264 -crf 18 out/manim.mp4
          ls -la out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manim
          path: smoke/manim/out/
          retention-days: 3

  blender:
    name: Blender (Cycles CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 libice6 ffmpeg > /dev/null || true
      - name: Download Blender 4.5 LTS
        run: |
          F=$(curl -s https://download.blender.org/release/Blender4.5/ | grep -oE 'blender-4\.5\.[0-9]+-linux-x64\.tar\.xz' | sort -V | uniq | tail -1)
          echo "Downloading $F"
          curl -sL -o b.tar.xz "https://download.blender.org/release/Blender4.5/$F"
          mkdir -p $HOME/blender && tar -xf b.tar.xz -C $HOME/blender --strip-components=1
          $HOME/blender/blender --version | head -1
      - name: Render
        run: |
          mkdir -p out
          $HOME/blender/blender -b --factory-startup -P smoke/blender/smoke.py -- $PWD/out/blender_ 2>&1 | (grep -E "BLENDER|Error|Traceback|Saved: .*00(01|45)" || true) | tail -40
          ffmpeg -v error -y -framerate 30 -i out/blender_%04d.png -c:v libx264 -crf 18 -pix_fmt yuv420p out/blender.mp4
          ls -la out/blender.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blender
          path: out/blender.mp4
          retention-days: 3

  triposr:
    name: TripoSR (CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install TripoSR
        run: |
          git clone -q --depth 1 https://github.com/VAST-AI-Research/TripoSR $HOME/TripoSR
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -q setuptools wheel cmake ninja pybind11 scikit-build scikit-build-core
          pip install -q --no-build-isolation git+https://github.com/tatsy/torchmcubes.git
          grep -v torchmcubes $HOME/TripoSR/requirements.txt > req.txt && pip install -q -r req.txt
      - name: Image to 3D (+ turntable render)
        run: |
          cd $HOME/TripoSR
          IMG=$(ls examples/*.png | head -1); echo "input: $IMG"
          python run.py "$IMG" --device cpu --output-dir $GITHUB_WORKSPACE/out/triposr --model-save-format glb --render 2>&1 | tail -12
          ls -la $GITHUB_WORKSPACE/out/triposr/0/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: triposr
          path: out/triposr/
          retention-days: 3

  hf-spaces:
    name: Hunyuan3D-2 / TripoSR / ACE-Step via HF Spaces
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q gradio_client
      - run: python smoke/spaces/probe.py 2>&1 | tail -40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hf-spaces
          path: out/spaces/
          retention-days: 3

  image-tools:
    name: rembg + Depth-Anything-V2 + Real-ESRGAN
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -q "rembg[cpu]" transformers pillow realesrgan basicsr opencv-python-headless
          F=$(python -c "import importlib.util,os;s=importlib.util.find_spec('basicsr');print(os.path.join(os.path.dirname(s.origin),'data','degradations.py'))")
          sed -i 's/torchvision.transforms.functional_tensor/torchvision.transforms.functional/' "$F"
      - run: python smoke/tools/image_tools.py 2>&1 | tail -15
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-tools
          path: out/images/
          retention-days: 3

  data-tools:
    name: Natural Earth + mapshaper + turf + polylabel + flubber
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    defaults:
      run:
        working-directory: smoke/data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run
        run: |
          npm i --no-audit --no-fund --loglevel=error mapshaper@0.6 @turf/turf@7 polylabel@1.1.0 flubber@0.4.2 d3-geo@3.1.1
          curl -sL -o ne50.geojson https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_admin_0_countries.geojson
          curl -sL -o ne10_adm1.geojson https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_admin_1_states_provinces.geojson
          ls -la *.geojson
          npx mapshaper ne50.geojson -filter '["RUS","UKR","BLR","KAZ","UZB","TKM","KGZ","TJK","GEO","ARM","AZE","MDA","EST","LVA","LTU"].indexOf(ADM0_A3) > -1' -simplify 20% keep-shapes -o format=geojson ussr15.json
          npx mapshaper ne10_adm1.geojson -filter 'adm0_a3 == "RUS"' -simplify 5% keep-shapes -o format=geojson rus_adm1.json
          node test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-tools
          path: |
            smoke/data/report.json
            smoke/data/ussr15.json
          retention-days: 3

  reel:
    name: Combine smoke reel
    needs: [remotion, manim, blender, triposr]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
      - name: Build reel
        run: |
          mkdir -p out; : > out/list.txt; i=0
          FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
          add() {
            if [ ! -f "$1" ]; then echo "MISSING: $1"; return; fi
            i=$((i+1))
            ffmpeg -v error -y -f lavfi -i color=c=0x0d1b2a:s=1920x1080:r=30:d=1.5 -vf "drawtext=fontfile=$FONT:text='$2':fontcolor=white:fontsize=60:x=(w-text_w)/2:y=(h-text_h)/2" -c:v libx264 -pix_fmt yuv420p out/t$i.mp4
            ffmpeg -v error -y -i "$1" -vf "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2:color=0x0d1b2a,fps=30,format=yuv420p" -an -c:v libx264 -crf 20 out/c$i.mp4
            echo "file 't$i.mp4'" >> out/list.txt; echo "file 'c$i.mp4'" >> out/list.txt
          }
          add art/remotion/remotion.mp4 "Remotion + Three.js + ECharts + flag-icons"
          add art/manim/manim.mp4 "Manim (transparent overlay)"
          add art/blender/blender.mp4 "Blender - Cycles"
          add art/triposr/0/render.mp4 "TripoSR - image to 3D"
          cd out && ffmpeg -v error -y -f concat -safe 0 -i list.txt -c copy smoke_reel.mp4 && ls -la smoke_reel.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-reel
          path: out/smoke_reel.mp4
          retention-days: 3
