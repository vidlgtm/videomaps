name: manim2
# Re-render of the two Manim parchment documents (Pillow 13 broke manim's ImageMobject path -> pin pillow 11.2.1).
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  manim2:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libcairo2-dev libpango1.0-dev pkg-config ffmpeg fontconfig > /dev/null
      - name: Fonts (OFL)
        run: |
          mkdir -p ~/.local/share/fonts
          curl -sfL --retry 3 -o ~/.local/share/fonts/CormorantGaramond.ttf "https://github.com/google/fonts/raw/main/ofl/cormorantgaramond/CormorantGaramond%5Bwght%5D.ttf"
          curl -sfL --retry 3 -o ~/.local/share/fonts/CormorantGaramond-Italic.ttf "https://github.com/google/fonts/raw/main/ofl/cormorantgaramond/CormorantGaramond-Italic%5Bwght%5D.ttf"
          curl -sfL --retry 3 -o ~/.local/share/fonts/GreatVibes-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/greatvibes/GreatVibes-Regular.ttf"
          fc-cache -f > /dev/null; fc-list | grep -iE "cormorant|great vibes" | head
      - run: pip install -q "manim==0.22.0" "pillow==11.2.1" scipy
      - name: Render
        shell: bash
        run: |
          cd production/manim
          manim render -qh --fps 30 -r 1920,1080 scenes2.py Article72 UtiPossidetis 2>&1 | tail -25
          mkdir -p $GITHUB_WORKSPACE/out/manim2
          cp "$(find media -name Article72.mp4 | head -1)" $GITHUB_WORKSPACE/out/manim2/article72.mp4
          cp "$(find media -name UtiPossidetis.mp4 | head -1)" $GITHUB_WORKSPACE/out/manim2/uti.mp4
          cd $GITHUB_WORKSPACE/out/manim2
          for f in article72 uti; do ffmpeg -loglevel error -y -sseof -0.5 -i $f.mp4 -frames:v 1 -vf scale=960:-1 ${f}_end.jpg; done
          ls -la
      - uses: actions/upload-artifact@v4
        with: { name: manim2, path: out/manim2, retention-days: 14 }
      - name: Release assets2
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release view assets2 --repo ${{ github.repository }} > /dev/null 2>&1 || \
            gh release create assets2 --repo ${{ github.repository }} --title "Assets v2" --notes "v2 production assets (HD terrain, archive, icons, Caucasus v2, Manim documents, precise timings)" || true
          sleep 5
          gh release upload assets2 out/manim2/* --repo ${{ github.repository }} --clobber
