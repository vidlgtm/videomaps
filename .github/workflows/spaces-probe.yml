name: spaces-probe
on:
  workflow_dispatch:
jobs:
  probe:
    name: HF Spaces probe (Hunyuan3D-2 / TripoSR / ACE-Step)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q gradio_client && pip show gradio_client | head -2
      - run: python smoke/spaces/probe.py 2>&1 | tail -60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hf-spaces
          path: out/spaces/
          retention-days: 3
