name: models3d
on:
  workflow_dispatch:
    inputs:
      image_url:
        description: "Input image URL (object on plain background)"
        default: "https://raw.githubusercontent.com/VAST-AI-Research/TripoSR/main/examples/chair.png"
      name:
        description: "Asset name"
        default: "test"
      mc_resolution:
        description: "Marching-cubes resolution"
        default: "256"
jobs:
  triposr:
    name: TripoSR image-to-3D (CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-triposr-v1
      - name: Install TripoSR
        run: |
          git clone -q --depth 1 https://github.com/VAST-AI-Research/TripoSR $HOME/TripoSR
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -q setuptools wheel cmake ninja pybind11 scikit-build scikit-build-core onnxruntime
          pip install -q --no-build-isolation git+https://github.com/tatsy/torchmcubes.git
          grep -v torchmcubes $HOME/TripoSR/requirements.txt > req.txt && pip install -q -r req.txt
      - name: Image to 3D (+ turntable)
        run: |
          mkdir -p in && curl -sL -o in/input.png "${{ inputs.image_url }}"
          cd $HOME/TripoSR
          python run.py $GITHUB_WORKSPACE/in/input.png --device cpu --mc-resolution ${{ inputs.mc_resolution }} \
            --output-dir $GITHUB_WORKSPACE/out/${{ inputs.name }} --model-save-format glb --render 2>&1 | tail -12
          ls -la $GITHUB_WORKSPACE/out/${{ inputs.name }}/0/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-${{ inputs.name }}
          path: out/${{ inputs.name }}/
          retention-days: 7
