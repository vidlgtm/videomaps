name: assemble
# Frame-exact final assembly from the chunk + audio artifacts of a stage2 render run (no re-render).
on:
  workflow_dispatch:
    inputs:
      run_id: { description: 'stage2 run with part-* and audio-master artifacts', default: '39419766208' }
      tag: { description: 'release tag', default: 'final' }
permissions:
  contents: write
  actions: read
jobs:
  final:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: 'part-*', path: parts, merge-multiple: true, run-id: '${{ inputs.run_id }}', github-token: '${{ github.token }}' }
      - uses: actions/download-artifact@v4
        with: { name: audio-master, path: audio, run-id: '${{ inputs.run_id }}', github-token: '${{ github.token }}' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null && pip install -q pillow
      - name: Assemble (frame-exact), QA, publish
        env: { GH_TOKEN: '${{ github.token }}' }
        run: bash production/pipeline/assemble.sh parts audio/mix_final.wav 16807 "${{ inputs.tag }}"
