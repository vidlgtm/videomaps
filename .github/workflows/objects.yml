name: objects
# 3D objects of an order (factory/orders/<order>/objects.json: small map icons - TripoSR; models - Hunyuan3D-2; or a
# GLB from the order store), only from order-store pictures.
# stage preview: object check + cut-outs + coarse CPU stand-ins rendered from 4 azimuths with automatic checks (no GPU);
#                a store GLB gets its final renders here.
# stage render : one Kaggle GPU batch for the objects whose current preview passed and was approved, checked again and
#                kept by content in objects_cache. A failed final is made again only when "retry" names it.
on:
  workflow_dispatch:
    inputs:
      order: { description: 'order folder in factory/orders', required: true }
      stage: { description: 'preview | render', required: true, default: 'preview' }
      retry: { description: 'render only: objects whose failed final may be made again (comma list)', default: '' }

permissions:
  contents: write

jobs:
  objects:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      GH_TOKEN: ${{ github.token }}
      ORDER: ${{ inputs.order }}
      STAGE: ${{ inputs.stage }}
      RETRY: ${{ inputs.retry }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Hermetic check - pictures only from the order store
        run: python3 factory/rules/hermetic.py
      - name: Object check
        run: |
          pip install -q numpy pillow scipy
          python3 factory/objects/objects.py factory/orders/$ORDER --stage "$STAGE" --dry
      - name: Order store - the order's pictures with their licences
        if: inputs.stage == 'preview'
        run: |
          set -e
          S=factory/orders/$ORDER/store.json
          R=$(python3 -c "import json; print(json.load(open('$S'))['release'])")
          mkdir -p factory/orders/$ORDER/store_files
          gh release download "$R" -R ${{ github.repository }} -D factory/orders/$ORDER/store_files --clobber
          echo "order store $R: $(ls factory/orders/$ORDER/store_files | wc -l) files"
      - name: TripoSR on the CPU (coarse stand-ins for the preview only) + cut-out
        if: inputs.stage == 'preview'
        run: |
          set -e
          git clone -q https://github.com/VAST-AI-Research/TripoSR "$HOME/TripoSR"
          (cd "$HOME/TripoSR" && git checkout -q 107cefdc244c39106fa830359024f6a2f1c78871)
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -q setuptools wheel cmake ninja pybind11 scikit-build scikit-build-core
          pip install -q --no-build-isolation git+https://github.com/tatsy/torchmcubes.git@a9ac95aa329957ba646e7bb057f825f5dfa77f38
          pip install -q onnxruntime rembg omegaconf==2.3.0 einops transformers==4.57.6 trimesh huggingface-hub "imageio[ffmpeg]" xatlas moderngl
          python3 -c "import transformers, torchmcubes; print('Transformers', transformers.__version__)"
      - name: Kaggle client
        if: inputs.stage == 'render'
        run: pip install -q "kaggle>=1.7.4"
      - name: Blender version
        id: bl
        if: inputs.stage == 'preview'
        run: echo "file=$(curl -s https://download.blender.org/release/Blender4.5/ | grep -oE 'blender-4\.5\.[0-9]+-linux-x64\.tar\.xz' | sort -V | uniq | tail -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: inputs.stage == 'preview'
        with: { path: /opt/blender, key: "${{ steps.bl.outputs.file }}" }
      - name: Blender
        if: inputs.stage == 'preview'
        run: |
          if [ ! -x /opt/blender/blender ]; then
            sudo mkdir -p /opt/blender && sudo chown "$USER" /opt/blender
            curl -sfL --retry 3 -o /tmp/b.tar.xz "https://download.blender.org/release/Blender4.5/${{ steps.bl.outputs.file }}"
            tar -xf /tmp/b.tar.xz -C /opt/blender --strip-components=1 && rm /tmp/b.tar.xz
          fi
          if ! /opt/blender/blender -b --version > /dev/null 2>&1; then
            sudo timeout 900 apt-get install -y -qq --no-install-recommends libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 libice6 || true
          fi
          /opt/blender/blender -b --version | head -1
      - name: Objects
        run: |
          python3 -u factory/objects/objects.py factory/orders/$ORDER --stage "$STAGE" --blender /opt/blender/blender \
            --release objects_cache --sha ${{ github.sha }} --repo ${{ github.repository }} ${RETRY:+--retry "$RETRY"}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: objects-${{ inputs.stage }}
          path: |
            factory/orders/${{ inputs.order }}/out/objects*.json
            factory/orders/${{ inputs.order }}/out/objects_review/
          if-no-files-found: ignore
