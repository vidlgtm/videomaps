name: uhd3
# v3 deep-zoom Sentinel-2 detail tiles (per-tile windows), uploaded into release assets4
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  uhd:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -q numpy scipy pillow requests pyshp
      - run: python -u production/pipeline/terrain3.py
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cd out/terrain3 && cp uhd/index.json uhd_index.json && zip -q -r uhd.zip uhd && ls -la
          test $(ls uhd/u_*.jpg | wc -l) -eq $(python3 -c "import json; print(len(json.load(open('uhd_index.json'))['tiles']))")
          gh release upload assets4 uhd.zip uhd_index.json uhd_sheet.jpg --clobber -R ${{ github.repository }}
