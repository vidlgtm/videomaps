name: blender_clip
# CPU fallback of kaggle/blender_clip (use Kaggle first: ~30x faster). Renders one Blender clip and publishes it to
# release clips-<project>, where film.yml (prep) picks up every file listed in project.json "clips".
on:
  workflow_dispatch:
    inputs:
      project: { description: 'project name', default: 'example_baltic' }
      script: { description: 'production/blender/<script>', default: 'caucasus3.py' }
      args: { description: 'extra script args', default: '--data out/cauc3' }
      frames: { description: 'frame count (30 fps)', default: '300' }
      name: { description: 'output clip name (no extension)', default: 'clip' }
      prep: { description: 'optional python prep command', default: '' }
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -e
          pip install -q numpy scipy pillow requests pyshp geopandas shapely pyogrio
          [ -n "${{ inputs.prep }}" ] && ${{ inputs.prep }}
          bash production/ci/install_blender.sh
          $HOME/blender/blender -b --python-exit-code 1 -P production/blender/${{ inputs.script }} -- ${{ inputs.args }} --out /tmp/frames --start 1 --end ${{ inputs.frames }} 2>&1 | grep -E "Error|Traceback|frame" | tail -30
          E=jpg; ls /tmp/frames/f_0001.jpg > /dev/null 2>&1 || E=png
          ffmpeg -v error -y -framerate 30 -start_number 1 -i /tmp/frames/f_%04d.$E -c:v libx264 -crf 12 -preset slow -pix_fmt yuv420p ${{ inputs.name }}.mp4
          gh release view clips-${{ inputs.project }} > /dev/null 2>&1 || gh release create clips-${{ inputs.project }} --title "clips ${{ inputs.project }}" --notes "Blender clips"
          gh release upload clips-${{ inputs.project }} ${{ inputs.name }}.mp4 --clobber
