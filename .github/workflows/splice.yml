name: splice
# Final assembly from a stage3 run whose parts are (partly) replaced by re-renders of the same frame ranges made by
# other stage3 runs: fixes = {"<part>": "<run id>", ...}. The audio is re-mixed from the current commit so that every
# cue/SFX change stays in sync with the picture. Frame-exact assembly + QA + release TAG.
on:
  workflow_dispatch:
    inputs:
      main_run: { description: 'stage3 run id with the parts', required: true }
      fixes: { description: 'JSON {"part": "run id"} of re-rendered parts', required: true }
      tag: { description: 'release tag', default: 'film_v2_1' }
permissions:
  contents: write
  actions: read
env:
  S1: https://github.com/${{ github.repository }}/releases/download/stage1
jobs:
  audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo rm -f /etc/apt/sources.list.d/microsoft*; sudo apt-get update -qq || true; sudo apt-get install -y -qq ffmpeg unzip > /dev/null && pip install -q numpy scipy
      - name: Mix + master (full film, current cues, -14 LUFS)
        working-directory: production/remotion
        run: |
          set -e
          PUB=/tmp/rpub; mkdir -p $PUB/music $PUB/sfx out/audio
          curl -sfL --retry 3 -o $PUB/voice.wav "$S1/voice.wav"
          for c in c1_hook c2_origins c3_annex c4_collapse c5_resolution; do curl -sfL --retry 3 -o $PUB/music/music_$c.mp3 "$S1/music_$c.mp3"; done
          curl -sfL --retry 3 -o /tmp/sfx.zip "$S1/sfx.zip" && (cd $PUB/sfx && unzip -q -o /tmp/sfx.zip)
          mkdir -p /tmp/s2
          (cd /tmp/s2; python $GITHUB_WORKSPACE/production/pipeline/sfx2.py)
          cp /tmp/s2/out/sfx/*.wav $PUB/sfx/
          npm i --no-audit --no-fund --loglevel=error
          node scripts/build_audio.mjs && EVENTS_OUT=out/audio_events.json node out/audio_events.cjs
          python ../pipeline/mix.py out/audio_events.json $PUB out/audio
          python ../pipeline/master.py out/audio | tee out/audio/audio_report.txt
          TOTAL=$(node -e "const t=require('./src/data/timeline.json'); console.log(Math.ceil(t.total*30))")
          E=$(python3 -c "print($TOTAL/30)")
          ffmpeg -v error -y -i out/audio/mix_final.wav -af "atrim=start=0:end=$E,asetpts=PTS-STARTPTS" -c:a pcm_s24le out/audio/mix_range.wav
          echo "range 0-$((TOTAL - 1)): $(ffprobe -v error -show_entries format=duration -of csv=p=0 out/audio/mix_range.wav) s" | tee -a out/audio/audio_report.txt
          echo $TOTAL > out/audio/frames.txt
      - uses: actions/upload-artifact@v4
        with:
          name: audio-master
          path: |
            production/remotion/out/audio/mix_range.wav
            production/remotion/out/audio/audio_report.txt
            production/remotion/out/audio/frames.txt
          retention-days: 5

  final:
    needs: [audio]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the re-renders (all render jobs of every fix run done)
        env: { GH_TOKEN: '${{ github.token }}', FIXES: '${{ inputs.fixes }}' }
        run: |
          RUNS=$(python3 -c "import json,os; print(' '.join(json.loads(os.environ['FIXES']).values()))")
          for i in $(seq 1 700); do
            ALL=1
            for R in $RUNS; do
              J=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$R/jobs?per_page=100" \
                --jq '[.jobs[] | select(.name | startswith("render"))] | "\(length) \([.[] | select(.status=="completed")] | length) \([.[] | select(.conclusion=="failure" or .conclusion=="cancelled")] | length)"')
              set -- $J; echo "$(date -u +%H:%M) run $R renders: total $1 done $2 bad $3"
              [ "$3" != "0" ] && { echo "re-render $R has failed jobs"; exit 1; }
              if [ "$1" = "0" ] || [ "$1" != "$2" ]; then ALL=0; fi
            done
            [ $ALL = 1 ] && break
            sleep 30
          done
      - name: Collect parts (main run + replacements)
        env: { GH_TOKEN: '${{ github.token }}', FIXES: '${{ inputs.fixes }}' }
        run: |
          set -e
          mkdir -p parts/qa
          gh run download ${{ inputs.main_run }} -R $GITHUB_REPOSITORY -p 'part-*' -D main
          find main -name 'part_*.mp4' -exec mv {} parts/ \;
          find main -path '*/qa/*' -type f -exec cp {} parts/qa/ \;
          python3 -c "import json,os; [print(k, v) for k, v in json.loads(os.environ['FIXES']).items()]" > fixes.txt
          while read P R; do
            PP=$(printf %02d $P); rm -f parts/part_$PP.mp4
            gh run download $R -R $GITHUB_REPOSITORY -p 'part-*' -D fix_$PP
            for f in $(find fix_$PP -name 'part_*.mp4'); do b=$(basename $f .mp4); mv $f parts/part_${PP}_${b#part_}.mp4; done
            for q in $(find fix_$PP -path '*/qa/*' -type f); do cp $q parts/qa/fix${PP}_$(basename $q); done
          done < fixes.txt
          ls parts | sort | tr '\n' ' '; echo
      - uses: actions/download-artifact@v4
        with: { name: audio-master, path: audio }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo rm -f /etc/apt/sources.list.d/microsoft*; sudo apt-get update -qq || true; sudo apt-get install -y -qq ffmpeg > /dev/null && pip install -q pillow
      - name: Assemble (frame-exact), QA, publish
        env: { GH_TOKEN: '${{ github.token }}' }
        run: bash production/pipeline/assemble.sh parts audio/mix_range.wav $(cat audio/frames.txt) "${{ inputs.tag }}"
